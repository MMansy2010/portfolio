<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة الأدمن</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body>

  <header>
    <h1>🎛️ لوحة التحكم</h1>
  </header>

  <!-- إحصائيات -->
  <section id="stats-section">
    <div class="stat-card">
      <span id="count-pending">0</span>
      <p>في الانتظار</p>
    </div>
    <div class="stat-card">
      <span id="count-cooking">0</span>
      <p>بيتطبخ</p>
    </div>
    <div class="stat-card">
      <span id="count-delivering">0</span>
      <p>بيتوصل</p>
    </div>
    <div class="stat-card">
      <span id="count-done">0</span>
      <p>اتسلم</p>
    </div>
  </section>

  <!-- الطلبات -->
  <section id="orders-section">
    <h2>📋 الطلبات</h2>

    <!-- فلتر -->
    <div id="filter-bar">
      <button class="filter-btn active" data-status="all">الكل</button>
      <button class="filter-btn" data-status="pending">انتظار</button>
      <button class="filter-btn" data-status="cooking">طبخ</button>
      <button class="filter-btn" data-status="delivering">توصيل</button>
      <button class="filter-btn" data-status="done">اتسلم</button>
    </div>

    <div id="orders-container">
      <p id="loading-msg">جاري التحميل...</p>
    </div>
  </section>

  <script type="module" src="admin.js"></script>
</body>
</html>

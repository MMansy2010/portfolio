<style>
:root {
--primary-color: #4361ee;
--secondary-color: #3f37c9;
--success-color: #4cc9f0;
--warning-color: #f72585;
--dark-bg: #1e293b;
--light-bg: #f8fafc;
--card-bg: #ffffff;
--text-primary: #1e293b;
--text-secondary: #64748b;
--border-color: #e2e8f0;
--border-radius: 12px;
--box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
--transition: all 0.3s ease;
--font-main: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}
.dark {
--primary-color: #536dfe;
--secondary-color: #4a56e2;
--success-color: #5ed1f5;
--warning-color: #ff528f;
--dark-bg: #0f172a;
--light-bg: #1e293b;
--card-bg: #1e293b;
--text-primary: #f1f5f9;
--text-secondary: #94a3b8;
--border-color: #334155;
--box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
}
* {
margin: 0;
padding: 0;
box-sizing: border-box;
}
body {
font-family: var(--font-main);
background: linear-gradient(135deg, var(--light-bg) 0%, #e4edf5 100%);
color: var(--text-primary);
line-height: 1.6;
padding: 20px;
transition: var(--transition);
min-height: 100vh;
}
.dark body {
background: linear-gradient(135deg, var(--dark-bg) 0%, #0a0f1d 100%);
}
.container {
max-width: 1200px;
margin: 0 auto;
}
header {
display: flex;
justify-content: space-between;
align-items: center;
padding: 20px 0;
border-bottom: 1px solid var(--border-color);
margin-bottom: 30px;
}
h1 {
font-size: 2.5rem;
font-weight: 800;
background: linear-gradient(45deg, var(--primary-color), var(--success-color));
-webkit-background-clip: text;
background-clip: text;
color: transparent;
letter-spacing: -0.5px;
}
.controls {
display: flex;
gap: 15px;
}
.toggle-btn {
background: var(--card-bg);
border: 1px solid var(--border-color);
width: 50px;
height: 30px;
border-radius: 15px;
position: relative;
cursor: pointer;
box-shadow: var(--box-shadow);
transition: var(--transition);
display: flex;
align-items: center;
justify-content: center;
font-weight: 600;
color: var(--text-primary);
}
.toggle-btn::after {
content: "";
position: absolute;
width: 26px;
height: 26px;
background: var(--primary-color);
border-radius: 50%;
left: 2px;
transition: var(--transition);
}
.dark .toggle-btn::after {
background: var(--warning-color);
transform: translateX(20px);
}
.lang-toggle {
background: var(--card-bg);
border: 1px solid var(--border-color);
padding: 8px 16px;
border-radius: 20px;
font-weight: 600;
cursor: pointer;
box-shadow: var(--box-shadow);
transition: var(--transition);
color: var(--text-primary);
}
.lang-toggle:hover {
transform: translateY(-2px);
box-shadow: 0 6px 25px rgba(0, 0, 0, 0.15);
}
.dark .lang-toggle:hover {
box-shadow: 0 6px 25px rgba(0, 0, 0, 0.35);
}
.install-btn {
background: linear-gradient(45deg, #4CAF50, #45a049);
color: white;
border: none;
padding: 10px 20px;
border-radius: 20px;
font-weight: 600;
cursor: pointer;
transition: var(--transition);
box-shadow: 0 4px 15px rgba(76, 175, 80, 0.4);
display: none;
}
.install-btn:hover {
transform: translateY(-2px);
box-shadow: 0 6px 20px rgba(76, 175, 80, 0.6);
}
.task-form {
background: var(--card-bg);
border-radius: var(--border-radius);
padding: 25px;
box-shadow: var(--box-shadow);
margin-bottom: 30px;
transition: var(--transition);
border: 1px solid var(--border-color);
}
.form-group {
margin-bottom: 20px;
}
label {
display: block;
margin-bottom: 8px;
font-weight: 600;
color: var(--text-primary);
}
input, textarea, select {
width: 100%;
padding: 14px;
border: 1px solid var(--border-color);
border-radius: 10px;
font-family: var(--font-main);
font-size: 16px;
transition: var(--transition);
background: var(--card-bg);
color: var(--text-primary);
}
input:focus, textarea:focus, select:focus {
outline: none;
border-color: var(--primary-color);
box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.2);
}
.dark input:focus, .dark textarea:focus, .dark select:focus {
box-shadow: 0 0 0 3px rgba(83, 109, 254, 0.3);
}
textarea {
min-height: 100px;
resize: vertical;
}
.datetime-group {
display: flex;
gap: 15px;
flex-wrap: wrap;
}
.datetime-group div {
flex: 1;
min-width: 150px;
}
.days-selection {
display: grid;
grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
gap: 10px;
margin-top: 10px;
padding: 15px;
background: rgba(67, 97, 238, 0.05);
border-radius: 10px;
border: 1px solid var(--border-color);
}
.dark .days-selection {
background: rgba(83, 109, 254, 0.1);
border-color: var(--border-color);
}
.day-checkbox {
display: flex;
flex-direction: column;
align-items: center;
cursor: pointer;
padding: 8px;
border-radius: 8px;
transition: var(--transition);
text-align: center;
}
.day-checkbox:hover {
background: rgba(67, 97, 238, 0.1);
}
.dark .day-checkbox:hover {
background: rgba(83, 109, 254, 0.2);
}
.day-checkbox input {
width: auto;
margin-right: 0;
height: 20px;
width: 20px;
cursor: pointer;
margin-bottom: 5px;
}
.day-label {
margin-top: 5px;
font-size: 14px;
font-weight: 500;
color: var(--text-primary);
}
button {
background: linear-gradient(45deg, var(--primary-color), var(--secondary-color));
color: white;
border: none;
padding: 14px 28px;
border-radius: 10px;
font-size: 16px;
font-weight: 600;
cursor: pointer;
transition: var(--transition);
width: 100%;
box-shadow: 0 4px 15px rgba(67, 97, 238, 0.4);
}
button:hover {
transform: translateY(-2px);
box-shadow: 0 6px 20px rgba(67, 97, 238, 0.6);
}
button:active {
transform: translateY(0);
}
.notification-area {
position: fixed;
top: 20px;
right: 20px;
z-index: 1000;
display: flex;
flex-direction: column;
gap: 10px;
max-width: 350px;
}
.notification {
background: var(--card-bg);
border-left: 4px solid var(--warning-color);
border-radius: 8px;
padding: 15px 20px;
box-shadow: var(--box-shadow);
display: flex;
align-items: flex-start;
gap: 10px;
animation: slideIn 0.3s ease-out, fadeOut 0.5s ease-in 2.5s forwards;
position: relative;
overflow: hidden;
border: 1px solid var(--border-color);
}
.notification::after {
content: "";
position: absolute;
bottom: 0;
left: 0;
width: 100%;
height: 4px;
background: var(--warning-color);
animation: progress 2.5s linear forwards;
}
@keyframes slideIn {
from {
transform: translateX(150%);
opacity: 0;
}
to {
transform: translateX(0);
opacity: 1;
}
}
@keyframes fadeOut {
from {
opacity: 1;
transform: translateX(0);
}
to {
opacity: 0;
transform: translateX(150%);
}
}
@keyframes progress {
from {
width: 100%;
}
to {
width: 0%;
}
}
.notification-icon {
font-size: 20px;
margin-top: 2px;
}
.notification-content h3 {
font-size: 18px;
margin-bottom: 5px;
color: var(--text-primary);
}
.notification-content p {
font-size: 14px;
color: var(--text-secondary);
}
.task-list {
display: grid;
grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
gap: 25px;
}
.task-card {
background: var(--card-bg);
border-radius: var(--border-radius);
padding: 20px;
box-shadow: var(--box-shadow);
transition: var(--transition);
border-left: 4px solid var(--primary-color);
position: relative;
overflow: hidden;
border: 1px solid var(--border-color);
}
.task-card:hover {
transform: translateY(-5px);
box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
}
.dark .task-card:hover {
box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
}
.task-card::before {
content: "";
position: absolute;
top: 0;
left: 0;
width: 100%;
height: 4px;
background: linear-gradient(90deg, var(--primary-color), var(--success-color));
}
.task-header {
display: flex;
justify-content: space-between;
align-items: flex-start;
margin-bottom: 15px;
padding-bottom: 15px;
border-bottom: 1px solid var(--border-color);
}
.task-title {
font-size: 1.4rem;
font-weight: 700;
margin-bottom: 5px;
color: var(--text-primary);
}
.task-days {
display: flex;
flex-wrap: wrap;
gap: 5px;
margin: 8px 0;
}
.day-badge {
background: rgba(67, 97, 238, 0.15);
color: var(--primary-color);
padding: 3px 8px;
border-radius: 12px;
font-size: 12px;
font-weight: 500;
}
.dark .day-badge {
background: rgba(83, 109, 254, 0.2);
color: var(--primary-color);
}
.task-time {
color: var(--primary-color);
font-weight: 600;
font-size: 0.95rem;
margin-top: 5px;
display: flex;
align-items: center;
gap: 5px;
}
.task-description {
color: var(--text-secondary);
margin-bottom: 20px;
line-height: 1.5;
}
.delete-btn {
background: linear-gradient(45deg, #ff5252, #f44336);
color: white;
border: none;
width: 36px;
height: 36px;
border-radius: 50%;
display: flex;
align-items: center;
justify-content: center;
cursor: pointer;
transition: var(--transition);
position: absolute;
top: 15px;
right: 15px;
font-weight: bold;
box-shadow: 0 2px 10px rgba(244, 67, 54, 0.3);
z-index: 10;
}
.delete-btn:hover {
transform: scale(1.1);
box-shadow: 0 4px 15px rgba(244, 67, 54, 0.4);
background: linear-gradient(45deg, #ff3d3d, #e53935);
}
.empty-state {
grid-column: 1 / -1;
text-align: center;
padding: 40px 20px;
color: var(--text-secondary);
}
.empty-state svg {
width: 100px;
height: 100px;
margin-bottom: 20px;
color: var(--primary-color);
opacity: 0.7;
}
.empty-state p {
font-size: 1.2rem;
max-width: 500px;
margin: 0 auto;
}
.theme-icon {
font-size: 18px;
}
.dark .theme-icon.sun {
display: none;
}
.theme-icon.moon {
display: none;
}
.dark .theme-icon.moon {
display: inline;
}
.dark .theme-icon.sun {
display: inline;
}
.app-version {
position: fixed;
bottom: 15px;
right: 15px;
background: var(--card-bg);
color: var(--text-secondary);
padding: 5px 10px;
border-radius: 20px;
font-size: 12px;
box-shadow: var(--box-shadow);
border: 1px solid var(--border-color);
z-index: 100;
}
.pwa-badge {
position: fixed;
top: 15px;
left: 15px;
background: linear-gradient(45deg, #4CAF50, #45a049);
color: white;
padding: 8px 16px;
border-radius: 20px;
font-size: 14px;
font-weight: 600;
box-shadow: 0 4px 15px rgba(76, 175, 80, 0.4);
z-index: 100;
display: none;

}
@keyframes pulse {
0%, 100% { box-shadow: 0 0 0 0 rgba(76, 175, 80, 0.7); }
50% { box-shadow: 0 0 0 10px rgba(76, 175, 80, 0); }
}
/* Responsive Design */
@media (max-width: 768px) {
.datetime-group {
flex-direction: column;
}
header {
flex-direction: column;
gap: 20px;
text-align: center;
}

width: 100%;
justify-content: center;
}
.task-list {

}

}

}
.days-selection {
grid-template-columns: repeat(auto-fill, minmax(50px, 1fr));
}
.day-label {

}
.controls {
flex-direction: column;
align-items: center;
}
.toggle-btn {
width: 100%;

}
}
/* RTL Support */
[dir="rtl"] {
direction: rtl;

}
[dir="rtl"] .controls {
flex-direction: row-reverse;
}
[dir="rtl"] .datetime-group {
flex-direction: column;
}
[dir="rtl"] .task-header {
flex-direction: row-reverse;
}
[dir="rtl"] .delete-btn {
right: auto;
left: 15px;
}
[dir="rtl"] .notification {
flex-direction: row-reverse;

}
[dir="rtl"] .notification::after {
left: auto;
right: 0;
}
[dir="rtl"] .task-card::before {
left: auto;

}
[dir="rtl"] .task-card {
border-left: none;

}
[dir="rtl"] .day-checkbox {
flex-direction: column-reverse;
}
[dir="rtl"] .task-time {
flex-direction: row-reverse;
}
[dir="rtl"] .pwa-badge {
left: auto;
right: 15px;
}
[dir="rtl"] .install-btn {
margin-left: 0;
margin-right: 10px;
}
</style>

<body>
<div class="container">
<header>
<h1 id="appTitle">To-Do App</h1>
<div class="controls">
<button id="themeToggle" class="toggle-btn" aria-label="Toggle dark mode">
<span class="theme-icon sun">☀️</span>
<span class="theme-icon moon">🌙</span>
</button>
<button id="langToggle" class="lang-toggle">EN</button>
<button id="installBtn" class="install-btn">Install App</button>
</div>
</header>
<form id="taskForm" class="task-form">
<div class="form-group">
<label for="title" id="titleLabel">Task Title</label>
<input type="text" id="title" placeholder="Enter task title" required>
</div>
<div class="form-group">
<label id="daysLabel">Days of the Week</label>
<div class="days-selection" id="daysSelection">
<!-- Days will be populated by JavaScript -->
</div>
</div>
<div class="form-group">
<label id="timeLabel">Time</label>
<div class="datetime-group">
<div>
<select id="taskHour" required>
<option value="">Select hour</option>
</select>
</div>
<div>
<select id="taskMinute" required>
<option value="">Select minute</option>
</select>
</div>
</div>
</div>
<div class="form-group">
<label for="description" id="descLabel">Description</label>
<textarea id="description" placeholder="Enter task description"></textarea>
</div>
<button type="submit" id="addTaskBtn">Add Task</button>
</form>
<div id="notificationArea" class="notification-area"></div>
<ul id="taskList" class="task-list">
<!-- Tasks will be dynamically added here -->
<div class="empty-state">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
<path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path>
</svg>
<p id="emptyText">No tasks added yet. Create your first task to get started!</p>
</div>
</ul>
</div>
<div class="pwa-badge" id="pwaBadge">✨ Install for better notifications!</div>
<div class="app-version">Version 2.1 - PWA Enhanced</div>

<script>
// ==================== SERVICE WORKER REGISTRATION ====================
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('data:text/javascript,' + encodeURIComponent(`
    // Service Worker for Background Notifications
    const CACHE_NAME = 'todo-app-v2.1';
    const urlsToCache = ['/'];

    // Install event
    self.addEventListener('install', event => {
      event.waitUntil(
        caches.open(CACHE_NAME)
          .then(cache => cache.addAll(urlsToCache))
      );
      self.skipWaiting();
    });

    // Activate event
    self.addEventListener('activate', event => {
      event.waitUntil(
        caches.keys().then(cacheNames => {
          return Promise.all(
            cacheNames.map(cacheName => {
              if (cacheName !== CACHE_NAME) {
                return caches.delete(cacheName);
              }
            })
          );
        })
      );
      return self.clients.claim();
    });

    // Fetch event
    self.addEventListener('fetch', event => {
      event.respondWith(
        caches.match(event.request)
          .then(response => response || fetch(event.request))
      );
    });

    // Background Sync for notifications
    self.addEventListener('periodicsync', event => {
      if (event.tag === 'check-notifications') {
        event.waitUntil(checkNotifications());
      }
    });

    // Notification click handler
    self.addEventListener('notificationclick', event => {
      event.notification.close();
      event.waitUntil(
        clients.matchAll({ type: 'window' }).then(clientList => {
          if (clientList.length > 0) {
            return clientList[0].focus();
          } else {
            return clients.openWindow('/');
          }
        })
      );
    });

    // Function to check notifications in background
    async function checkNotifications() {
      try {
        const tasks = JSON.parse(localStorage.getItem('tasks')) || [];
        const now = new Date();
        const currentDay = now.getDay();
        const currentHour = now.getHours();
        const currentMinute = now.getMinutes();
        const currentTime = currentHour * 60 + currentMinute;

        for (const task of tasks) {
          if (task.days.includes(currentDay)) {
            const taskTime = task.hour * 60 + task.minute;
            
            // Check if within 1 minute window
            if (Math.abs(currentTime - taskTime) <= 1) {
              const lastNotified = task.lastNotified ? new Date(task.lastNotified) : null;
              
              // Check if not notified today
              if (!lastNotified || !isSameDay(lastNotified, now)) {
                // Show notification
                self.registration.showNotification('⏰ Reminder', {
                  body: task.title + (task.description ? '\\n' + task.description : ''),
                  icon: 'data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%2024%2024%22%3E%3Ccircle%20cx=%2212%22%20cy=%2212%22%20r=%2210%22%20fill=%22%234361ee%22/%3E%3Cpath%20d=%22M12%206L12%2012%2016%2014%22%20stroke=%22white%22%20stroke-width=%222%22%20stroke-linecap=%22round%22%20stroke-linejoin=%22round%22/%3E%3C/svg%3E',
                  badge: 'data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%2024%2024%22%3E%3Ccircle%20cx=%2212%22%20cy=%2212%22%20r=%2210%22%20fill=%22%234361ee%22/%3E%3C/svg%3E',
                  requireInteraction: false,
                  silent: false,
                  vibrate: [200, 100, 200],
                  actions: [
                    { action: 'view', title: 'View Task' },
                    { action: 'close', title: 'Dismiss' }
                  ]
                });
              }
            }
          }
        }
      } catch (error) {
        console.error('Background notification check failed:', error);
      }
    }

    function isSameDay(date1, date2) {
      return date1.getFullYear() === date2.getFullYear() &&
             date1.getMonth() === date2.getMonth() &&
             date1.getDate() === date2.getDate();
    }
  `)).then(registration => {
    console.log('Service Worker registered successfully');
    
    // Enable background sync if supported
    if ('periodicSync' in registration) {
      registration.periodicSync.register('check-notifications', {
        minInterval: 60 * 1000 // Check every minute
      }).catch(err => console.log('Periodic sync registration failed:', err));
    }
  }).catch(error => {
    console.error('Service Worker registration failed:', error);
  });
}

// Initialize the app
function initApp() {
// Set initial theme

// Start notification checker

// Add event listeners
themeToggle.addEventListener('click', toggleTheme);
langToggle.addEventListener('click', toggleLanguage);
taskForm.addEventListener('submit', addTask);
installBtn.addEventListener('click', handleInstall);
// Add delegated event listener for delete buttons
taskList.addEventListener('click', (e) => {
const deleteBtn = e.target.closest('.delete-btn');
if (deleteBtn) {
const taskId = parseInt(deleteBtn.getAttribute('data-id'));
deleteTask(taskId);
}
});
// Show system ready notification

showNotification(
translations[currentLang].notificationsWorking,
"All features are working correctly",
'success'
);

translations[currentLang].pwaMode,
"Notifications will work in background",

}
}, 2000);
// Handle beforeinstallprompt event

e.preventDefault();
deferredPrompt = e;

translations[currentLang].installPrompt,

);

}

// Populate hour and minute selects
function populateTimeSelects() {
// Clear existing options except the first one
hourSelect.innerHTML = '<option value="">Select hour</option>';
minuteSelect.innerHTML = '<option value="">Select minute</option>';
// Hours (0-23)
for (let i = 0; i < 24; i++) {
const hour = i.toString().padStart(2, '0');
const option = document.createElement('option');
option.value = hour;
option.textContent = hour;
hourSelect.appendChild(option);
}
// Minutes (0-59)
for (let i = 0; i < 60; i++) {
const minute = i.toString().padStart(2, '0');
const option = document.createElement('option');
option.value = minute;
option.textContent = minute;
minuteSelect.appendChild(option);
}
// Set default values to current time
const now = new Date();
hourSelect.value = now.getHours().toString().padStart(2, '0');
minuteSelect.value = now.getMinutes().toString().padStart(2, '0');
}

// Populate days checkboxes
function populateDaysCheckboxes() {

const days = translations[currentLang].days;
days.forEach((day, index) => {
const dayElement = document.createElement('label');
dayElement.className = 'day-checkbox';

<input type="checkbox" name="day" value="${index}">

// Toggle theme

isDarkMode ? 'Dark Mode Enabled' : 'Light Mode Enabled',

);

// Toggle language
function toggleLanguage() {
currentLang = currentLang === 'en' ? 'ar' : 'en';

localStorage.setItem('language', currentLang);

currentLang === 'ar' ? 'الوضع العربي' : 'English Mode',
currentLang === 'ar' ? 'تم تغيير اللغة إلى العربية' : 'Language changed to English',
'info'
);

// Set language
function setLanguage(lang) {
// Update text content
document.getElementById('appTitle').textContent = translations[lang].appTitle;
document.getElementById('titleLabel').textContent = translations[lang].titleLabel;
document.getElementById('daysLabel').textContent = translations[lang].daysLabel;
document.getElementById('timeLabel').textContent = translations[lang].timeLabel;
document.getElementById('descLabel').textContent = translations[lang].descLabel;

// Add a new task
function addTask(e) {
e.preventDefault();
const title = document.getElementById('title').value.trim();
const hour = hourSelect.value;
const minute = minuteSelect.value;
const description = document.getElementById('description').value.trim();
// Get selected days
const selectedDays = Array.from(document.querySelectorAll('input[name="day"]:checked'))
.map(checkbox => parseInt(checkbox.value));
if (selectedDays.length === 0) {
showNotification('Error', translations[currentLang].selectDaysError, 'error');
return;
}
// Create new task
const newTask = {
id: Date.now(),
title,
days: selectedDays,
hour: parseInt(hour),
minute: parseInt(minute),
description,
lastNotified: null
};
// Add to tasks array
tasks.push(newTask);
// Save to localStorage
localStorage.setItem('tasks', JSON.stringify(tasks));
// Render tasks
renderTasks();
// Reset form
taskForm.reset();
const now = new Date();
hourSelect.value = now.getHours().toString().padStart(2, '0');
minuteSelect.value = now.getMinutes().toString().padStart(2, '0');
// Uncheck all days
document.querySelectorAll('input[name="day"]').forEach(checkbox => {
checkbox.checked = false;
});
// Show success notification
showNotification(
translations[currentLang].taskAdded,
`Your task "${title}" has been added successfully!`,
'success'
);
// Show next reminder time
const nextReminder = getNextReminderTime(newTask);
if (nextReminder) {
const options = {
weekday: 'long',
hour: '2-digit',
minute: '2-digit',
hour12: false
};
const reminderTime = nextReminder.toLocaleDateString(currentLang === 'ar' ? 'ar-EG' : 'en-US', options);
showNotification(
translations[currentLang].nextReminder,
`${reminderTime}`,
'info'
);
}
}

// Get next reminder time for a task
function getNextReminderTime(task) {
const now = new Date();
const currentDay = now.getDay();
const currentTime = now.getHours() * 60 + now.getMinutes();
const taskTime = task.hour * 60 + task.minute;
// Check today
if (task.days.includes(currentDay) && taskTime > currentTime) {
const nextTime = new Date(now);
nextTime.setHours(task.hour, task.minute, 0, 0);
return nextTime;
}
// Check upcoming days
for (let i = 1; i <= 7; i++) {
const nextDayIndex = (currentDay + i) % 7;
if (task.days.includes(nextDayIndex)) {
const nextDate = new Date(now);
nextDate.setDate(nextDate.getDate() + i);
nextDate.setHours(task.hour, task.minute, 0, 0);
return nextDate;
}
}
return null;
}

// Render tasks
function renderTasks() {
// Clear task list
taskList.innerHTML = '';
if (tasks.length === 0) {
const emptyState = document.createElement('div');
emptyState.className = 'empty-state';

<path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path>
</svg>
<p id="emptyText">${translations[currentLang].emptyText}</p>
`;
taskList.appendChild(emptyState);
return;
}
// Render each task
tasks.forEach(task => {
const taskCard = document.createElement('li');
taskCard.className = 'task-card';
// Format days for display
const dayBadges = task.days.map(dayIndex => {
const dayName = translations[currentLang].fullDays[dayIndex];
return `<span class="day-badge">${dayName}</span>`;
}).join('');
// Format time
const timeString = `${task.hour.toString().padStart(2, '0')}:${task.minute.toString().padStart(2, '0')}`;
taskCard.innerHTML = `
<button class="delete-btn" aria-label="${translations[currentLang].deleteTask}" data-id="${task.id}">×</button>
<div class="task-header">
<div>
<h2 class="task-title">${escapeHtml(task.title)}</h2>
<div class="task-days">${dayBadges}</div>
<div class="task-time">⏰ ${timeString}</div>
</div>
</div>
<p class="task-description">${escapeHtml(task.description || 'No description')}</p>
`;
taskList.appendChild(taskCard);
});
}

// Delete a task
function deleteTask(id) {
const taskIndex = tasks.findIndex(task => task.id === id);
if (taskIndex === -1) return;
const taskTitle = tasks[taskIndex].title;
tasks.splice(taskIndex, 1);
// Save to localStorage
localStorage.setItem('tasks', JSON.stringify(tasks));
// Render tasks
renderTasks();
// Show notification
showNotification(
translations[currentLang].taskDeleted,
`${translations[currentLang].taskDeletedMsg} "${taskTitle}"`,
'info'
);
}

// Start notification checker
function startNotificationChecker() {
// Check every 30 seconds for better accuracy
setInterval(checkNotifications, 30000);
// Check immediately on load
setTimeout(checkNotifications, 3000);
}

// Check for tasks that need notification
function checkNotifications() {
const now = new Date();
const currentDay = now.getDay();
const currentHour = now.getHours();
const currentMinute = now.getMinutes();
const currentTime = currentHour * 60 + currentMinute;
tasks.forEach(task => {
// Check if today is one of the selected days
if (task.days.includes(currentDay)) {
// Calculate task time in minutes
const taskTime = task.hour * 60 + task.minute;
// Check if we're within the notification window (30 second window)
if (Math.abs(currentTime - taskTime) <= 1) {
// Check if we haven't notified for this task today
if (!task.lastNotified || !isSameDay(task.lastNotified, now)) {
// Show notification
showNotification(
translations[currentLang].notificationTitle,
task.title,
'reminder',
task.description
);
// Update last notified time
task.lastNotified = now.getTime();
// Save to localStorage
localStorage.setItem('tasks', JSON.stringify(tasks));
}
}
}
});
}

// Check if two timestamps are on the same day
function isSameDay(timestamp1, timestamp2) {
const date1 = new Date(timestamp1);
const date2 = new Date(timestamp2);
return date1.getFullYear() === date2.getFullYear() &&
date1.getMonth() === date2.getMonth() &&
date1.getDate() === date2.getDate();
}

// Show notification (in-app + browser)
function showNotification(title, message, type = 'info', description = '') {
const notification = document.createElement('div');
notification.className = 'notification';
let icon = 'ℹ️';
if (type === 'success') icon = '✅';
if (type === 'error') icon = '❌';
if (type === 'reminder') icon = '⏰';
if (type === 'info') icon = 'ℹ️';
notification.innerHTML = `
<div class="notification-icon">${icon}</div>
<div class="notification-content">
<h3>${escapeHtml(title)}</h3>
<p>${escapeHtml(message)}</p>
${description ? `<p style="margin-top:5px;font-size:13px;opacity:0.8">${escapeHtml(description)}</p>` : ''}
</div>
`;
notificationArea.appendChild(notification);
// Remove after animation completes
setTimeout(() => {
notification.remove();
}, 3000);
// Also try browser notification if supported and permitted
if ((type === 'reminder' || type === 'success' || type === 'info') && 'Notification' in window) {
if (Notification.permission === 'granted') {
const notif = new Notification(title, {
body: `${message}${description ? '\\n' + description : ''}`,
icon: 'data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%2024%2024%22%3E%3Ccircle%20cx=%2212%22%20cy=%2212%22%20r=%2210%22%20fill=%22%234361ee%22/%3E%3Cpath%20d=%22M12%206L12%2012%2016%2014%22%20stroke=%22white%22%20stroke-width=%222%22%20stroke-linecap=%22round%22%20stroke-linejoin=%22round%22/%3E%3C/svg%3E',
badge: 'data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%2024%2024%22%3E%3Ccircle%20cx=%2212%22%20cy=%2212%22%20r=%2210%22%20fill=%22%234361ee%22/%3E%3C/svg%3E',
requireInteraction: type === 'reminder',
silent: false
});
// Close notification after 5 seconds
if (type !== 'reminder') {
setTimeout(() => notif.close(), 5000);
}
} else if (Notification.permission !== 'denied') {
Notification.requestPermission().then(permission => {
if (permission === 'granted') {
const notif = new Notification(title, {
body: `${message}${description ? '\\n' + description : ''}`,
icon: 'data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%2024%2024%22%3E%3Ccircle%20cx=%2212%22%20cy=%2212%22%20r=%2210%22%20fill=%22%234361ee%22/%3E%3Cpath%20d=%22M12%206L12%2012%2016%2014%22%20stroke=%22white%22%20stroke-width=%222%22%20stroke-linecap=%22round%22%20stroke-linejoin=%22round%22/%3E%3C/svg%3E',
badge: 'data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%2024%2024%22%3E%3Ccircle%20cx=%2212%22%20cy=%2212%22%20r=%2210%22%20fill=%22%234361ee%22/%3E%3C/svg%3E',
requireInteraction: type === 'reminder',
silent: false
});
if (type !== 'reminder') {
setTimeout(() => notif.close(), 5000);
}
}
});
}
}
}

// Escape HTML to prevent XSS
function escapeHtml(unsafe) {
if (!unsafe) return '';
return unsafe
.replace(/&/g, "&amp;")
.replace(/</g, "&lt;")
.replace(/>/g, "&gt;")
.replace(/"/g, "&quot;")
.replace(/'/g, "&#039;");
}

window.addEventListener('DOMContentLoaded', initApp);

// Request notification permission on user interaction
document.addEventListener('click', () => {
if ('Notification' in window && Notification.permission !== 'granted' && Notification.permission !== 'denied') {
Notification.requestPermission();
}
if (1) {
Notification.requestPermission();
}
}, { once: true });
